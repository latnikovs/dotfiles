# Colors live in light-theme.auto.conf / dark-theme.auto.conf, which kitty
# picks automatically from the macOS appearance (kitty 0.38+). They are
# generated from Ghostty's own theme files, so both terminals match.
# Catppuccin Latte when light, Catppuccin Macchiato when dark.

##### Font #####
font_family                 JetBrainsMonoNL Nerd Font
font_size                   16
# Ghostty: font-feature = -liga,-calt,-dlig
disable_ligatures           always

##### Cursor #####
cursor_shape                block
cursor_blink_interval       0

##### Window #####
background_opacity          1.0
window_padding_width        10
placement_strategy          center
# No titlebar, but keep the rounded corners and frame (Ghostty's "hidden"
# equivalent). The tab bar is unaffected: kitty draws it itself, inside the
# window. window_padding_width above keeps text clear of the rounded corners.
hide_window_decorations     titlebar-only

##### Tabs #####
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         angled
tab_title_template          "{index}: {title}"

##### Tab keys #####
# Jump straight to a tab, matching Ghostty's super+1..9. This overrides kitty's
# defaults, which map cmd+1..9 to first_window..ninth_window (splits inside a
# tab) — splits are tmux's job here, so the tab jump is the better use.
map cmd+1                   goto_tab 1
map cmd+2                   goto_tab 2
map cmd+3                   goto_tab 3
map cmd+4                   goto_tab 4
map cmd+5                   goto_tab 5
map cmd+6                   goto_tab 6
map cmd+7                   goto_tab 7
map cmd+8                   goto_tab 8
map cmd+9                   goto_tab 9

##### Behaviour #####
copy_on_select              clipboard
# Negative value hides the pointer as soon as you type (macOS only),
# matching Ghostty's mouse-hide-while-typing.
mouse_hide_wait             -1.0
confirm_os_window_close     0
macos_option_as_alt         yes
shell_integration           no-cursor
