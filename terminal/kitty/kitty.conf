# Colors live in light-theme.auto.conf / dark-theme.auto.conf, which kitty
# picks automatically from the macOS appearance (kitty 0.38+): Catppuccin Latte
# when light, Catppuccin Macchiato when dark. Both are generated — see
# generate-themes.py.

##### Font #####
font_family                 JetBrainsMonoNL Nerd Font
font_size                   16
disable_ligatures           always

##### Cursor #####
cursor_shape                block
cursor_blink_interval       0

##### Window #####
# Only the default background goes translucent — any cell with an explicit
# background colour stays opaque. That is what keeps the tmux status bar
# readable: its pills set their own background and stay solid, while the bar
# around them (drawn with bg=default) lets the desktop through.
background_opacity          0.9
# Lets ctrl+shift+a > m / l tune the opacity live, without editing this file.
dynamic_background_opacity  yes
window_padding_width        10
placement_strategy          center
# No titlebar, but keep the rounded corners and frame. The tab bar is
# unaffected: kitty draws it itself, inside the window. window_padding_width
# above keeps text clear of the rounded corners.
hide_window_decorations     titlebar-only

##### Tabs #####
# Hidden: tmux is the multiplexer here, and its status bar (top) already shows the
# session/window context, so kitty's own tab bar is redundant chrome. Tabs still
# exist — the cmd+1..9 maps below switch them blind. To bring the bar back, set
# tab_bar_style to 'separator'; the settings below shape it when it is shown.
tab_bar_style               hidden

# --- shown-bar styling (only takes effect if tab_bar_style is 'separator') ---
# Bottom edge, by the shell prompt; tmux's status bar stays at the top
# (status-position top in tmux.conf), so the two would sit at opposite edges.
tab_bar_edge                bottom
# Right-aligned, so the tabs sit in the corner rather than under the cursor.
tab_bar_align               right
# Thin middot with a space each side — clear tab boundaries, minimal width.
tab_separator               " · "
tab_title_template          "{index}: {title}"
# 'separator' style carries no background fill (see the theme files — active and
# inactive both sit on the window background), so the active tab is marked by
# weight, not colour. That beats 'powerline' (cap glyphs render opaque against the
# translucent bar — a white notch by the active tab) and 'fade' (its fade cells
# would only pad empty width around fill-less tabs).
# Transparent bar: the active/inactive tab colors come from the theme, but the
# bar itself stays 'none' so it floats on the same translucent window background
# as the tmux status bar at the top, instead of a hard opaque strip.
tab_bar_background          none
# Match the tmux active window pill: bold, not kitty's default bold-italic slant.
active_tab_font_style       bold
inactive_tab_font_style     normal

##### Tab keys #####
# Jump straight to a tab. This overrides kitty's defaults, which map cmd+1..9 to
# first_window..ninth_window (splits inside a tab) — splits are tmux's job here,
# so the tab jump is the better use.
map cmd+1                   goto_tab 1
map cmd+2                   goto_tab 2
map cmd+3                   goto_tab 3
map cmd+4                   goto_tab 4
map cmd+5                   goto_tab 5
map cmd+6                   goto_tab 6
map cmd+7                   goto_tab 7
map cmd+8                   goto_tab 8
map cmd+9                   goto_tab 9
# The tab bar is hidden, so cmd+1..9 switch blind. cmd+0 pops kitty's interactive
# tab picker (names + numbers) as a fallback when you forget which is which. This
# overrides the default cmd+0 (reset font size); ctrl+shift+backspace still does
# that, so nothing is lost.
map cmd+0                   select_tab

##### Behaviour #####
copy_on_select              clipboard
# Negative value hides the pointer as soon as you type (macOS only).
mouse_hide_wait             -1.0
confirm_os_window_close     0
macos_option_as_alt         yes
shell_integration           no-cursor
