# 'none' means reverse video: the cursor takes the cell's own colors
# rather than a fixed one, so it stays visible over any background.
# (The palette's own cursor colour, #f4dbd6, is deliberately unused.)
cursor                     none

# Tab bar, derived from this palette. The accent is the magenta
# slot (Catppuccin pink): blue and green already mean 'active tmux
# pane' and 'tmux session', so a kitty tab — the outermost
# container — gets a colour of its own rather than overloading one.
# Both tab foregrounds are chosen by contrast:
# active 9.3:1, inactive 6.6:1.
active_tab_background      #f5bde6
active_tab_foreground      #24273a
inactive_tab_background    #24273a
inactive_tab_foreground    #a5adcb
tab_bar_background         #24273a
