background                 #eff1f5
foreground                 #4c4f69
selection_background       #acb0be
selection_foreground       #4c4f69

# 'none' means reverse video: the cursor takes the cell's own colors
# rather than a fixed one, so it stays visible over any background.
# (The palette's own cursor colour, #dc8a78, is deliberately unused.)
cursor                     none

# Tab bar, derived from this palette. Neither tab gets a background
# fill — both sit on the window background so the whole bar stays
# uniformly translucent (kitty.conf sets tab_bar_background none, and
# a filled tab would render opaque against it). The active tab is
# marked by weight, not colour: bold (active_tab_font_style in
# kitty.conf) plus the full-strength foreground, versus the dimmed
# inactive foreground below.
# Foreground contrast on the bar: active 7.1:1, inactive 4.4:1.
active_tab_background      #eff1f5
active_tab_foreground      #4c4f69
inactive_tab_background    #eff1f5
inactive_tab_foreground    #6c6f85
