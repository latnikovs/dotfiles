# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 100000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off


##### Prefix / key bindings #####
# Change prefix from Ctrl-b to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config quickly: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Kill pane without confirmation: Prefix + x
bind x kill-pane

##### Splits #####
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}" 

# Vim-style pane movement (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix + p → open centered popup at 90% size running your shell
unbind g
bind-key g display-popup -w 90% -h 90% -x C -y C -d "#{pane_current_path}" "$SHELL -i"

##### Mouse #####
set -g mouse on

##### Copy mode (vi-style) #####
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# Configure Catppuccin
set -g @catppuccin_flavor "latte"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[fg=#{?client_prefix,#{@thm_red},#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}}},bg=default,bold] #{?client_prefix,,} #S #[fg=default,bg=default,nobold]"
set -ga status-left " #[fg=#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}},bg=default,bold]#{?window_zoomed_flag,,}#[fg=default,bg=default,nobold]"

# status right look and feel
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#[fg=#{?#{e|>=:10,#{battery_percentage}},#{@thm_red},#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}}},bg=default] #{battery_icon} #{battery_percentage} #[fg=default,bg=default,nobold]"
set -ga status-right "#[fg=#{?#{==:#(~/.tmux/plugins/tmux-online-status/scripts/online_status_icon.sh),ok},#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}},#{@thm_red}},bg=default] #{?#{==:#(~/.tmux/plugins/tmux-online-status/scripts/online_status_icon.sh),ok},󰖩 on,󰖪 off} #[fg=default,bg=default,nobold]"
set -ga status-right "#[fg=#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}},bg=default] 󰅐 %H:%M #[fg=default,bg=default,nobold]"


# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue}] #P #{pane_current_command} #[fg=#{@thm_blue},bg=default],#[fg=#{@thm_overlay_0}] #P #{pane_current_command} }"
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_1}"
setw -g pane-border-style "bg=default,fg=#{@thm_overlay_0}"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_1}"

set -g window-status-activity-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -gF window-status-separator "│"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=default,fg=#{?#{==:#{@catppuccin_flavor},latte},#{@thm_text},#{@thm_green}}"


run '~/.tmux/plugins/tpm/tpm'
