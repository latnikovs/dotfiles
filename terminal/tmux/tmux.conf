##### General #####
set -g default-terminal "screen-256color"
set -g history-limit 100000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Prefix / key bindings #####
# Change prefix from Ctrl-b to Ctrl-a
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix
# Reload config quickly: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Splits #####
# More natural split keys
#unbind '"'
#unbind %
#bind - split-window -v
#bind \ split-window -h

##### Pane navigation (vim-style) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Mouse #####
set -g mouse on

##### Copy mode (vi-style) #####
setw -g mode-keys vi
#bind-key -T copy-mode-vi v send -X begin-selection
#bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

##### Status bar #####
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

# simple colors
set -g status-style "bg=black,fg=white"
set -g message-style "bg=black,fg=green"
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=green"

# left/right status content
set -g status-left "#[fg=green]#S #[fg=white]| #[fg=yellow]#(whoami) "
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=white]| #[fg=cyan]%H:%M "

##### Window titles #####
setw -g window-status-current-style "fg=black,bg=yellow,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

##### Kill pane without confirmantion #####
unbind x
bind x kill-pane
