# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB,xterm-256color:RGB"

set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Windows are named after whatever is running in them (see
# automatic-rename-format below), which is what the icon map keys off.
set -g automatic-rename on
set -g allow-rename off


##### Prefix / key bindings #####
# Change prefix from Ctrl-b to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config quickly: Prefix + r
# Via reload.sh rather than source-file directly, so that a flavor change is
# actually picked up on a running server. See the script.
bind r run-shell '~/.tmux/scripts/reload.sh' \; display-message "tmux.conf reloaded"

# Kill pane without confirmation: Prefix + x
bind x kill-pane

##### Splits #####
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style pane movement (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Popups #####
# Prefix + t → terminal, Prefix + g → git. Both centered at 90%, opened in the
# directory of the pane you pressed them from.
unbind t
bind-key t display-popup -w 90% -h 90% -x C -y C -d "#{pane_current_path}" "$SHELL -i"

unbind g
bind-key g display-popup -w 90% -h 90% -x C -y C -d "#{pane_current_path}" -E "lazygit"

##### Mouse #####
set -g mouse on

##### Copy mode (vi-style) #####
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

# tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux' # palette source for the @thm_* colors below

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

##### Theme #####
# Follow the OS appearance, exactly like kitty already does via
# light-theme.auto.conf / dark-theme.auto.conf. This has to run before the
# catppuccin plugin loads, which is why the tpm `run` line stays at the very
# bottom of this file.
if-shell '[ "$(~/.tmux/scripts/flavor.sh)" = latte ]' \
	'set -g @catppuccin_flavor latte' \
	'set -g @catppuccin_flavor macchiato'

# Publishes the pill caps and Nerd Font icons as @cap_* / @ico_* options. tmux
# config has no \u escape, so this keeps private-use codepoints out of this file
# where they would be invisible and easy to lose. See scripts/icons.sh.
run-shell '~/.tmux/scripts/icons.sh'

set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

##### Status bar #####
# The bar is transparent and every module is a rounded pill floating on the
# terminal background. Modules live in ~/.tmux/scripts and print their own
# styling; see scripts/lib.sh for why the colors are passed as arguments.
set -g status-position top
set -g status-style "bg=default"
# 'centre' rather than 'absolute-centre': absolute-centre pins the window list
# to the exact middle of the terminal regardless of what is beside it, so on a
# narrow client it gets drawn straight over the right-hand modules.
set -g status-justify "centre"
set -g status-interval 5

# Nerd Font icon for whatever the window is running. Kept in an option so the
# status formats below stay readable; #{E:@win_icon} expands it per window.
set -g @win_icon "#{?#{m:*nvim*,#{pane_current_command}},#{@ico_vim},\
#{?#{m:*vim*,#{pane_current_command}},#{@ico_vim},\
#{?#{==:#{pane_current_command},lazygit},#{@ico_git},\
#{?#{==:#{pane_current_command},git},#{@ico_git},\
#{?#{==:#{pane_current_command},go},#{@ico_go},\
#{?#{m:node*,#{pane_current_command}},#{@ico_node},\
#{?#{m:*npm*,#{pane_current_command}},#{@ico_node},\
#{?#{m:python*,#{pane_current_command}},#{@ico_python},\
#{?#{==:#{pane_current_command},docker},#{@ico_docker},\
#{?#{==:#{pane_current_command},ssh},#{@ico_ssh},\
#{?#{==:#{pane_current_command},yazi},#{@ico_folder},\
#{?#{m:java*,#{pane_current_command}},#{@ico_java},\
#{?#{m:*sh,#{pane_current_command}},#{@ico_shell},\
#{@ico_default}}}}}}}}}}}}}}"

# status left: session pill (red while the prefix is held) + zoom pill
set -g status-left-length 100
set -g status-left ""
# Zero-width: reloads the config when the OS appearance flips. See the script.
set -ga status-left "#(~/.tmux/scripts/theme-watch.sh)"
# Filled in both flavors, so @acc_* + @pill_fg covers it with no branching:
# on dark that is crust on a bright pastel, on light near-white on a darkened
# accent. See scripts/palette.sh.
set -ga status-left "#[fg=#{?client_prefix,#{@acc_red},#{@acc_green}},bg=default]#{@cap_l}\
#[fg=#{@pill_fg},bg=#{?client_prefix,#{@acc_red},#{@acc_green}},bold] \
#{?client_prefix,#{@ico_prefix},#{@ico_session}} #S \
#[fg=#{?client_prefix,#{@acc_red},#{@acc_green}},bg=default,nobold]#{@cap_r} "
set -ga status-left "#{?window_zoomed_flag,\
#[fg=#{@fill_yellow}#,bg=default]#{@cap_l}\
#[bg=#{@fill_yellow}#,bold]#[fg=#{@icon_yellow}] #{@ico_zoom}\
#[fg=#{@text_yellow}] zoom \
#[fg=#{@fill_yellow}#,bg=default#,nobold]#{@cap_r} ,}"

# status right: git · cpu · mem · battery · network · clock
#
# One job, not one per module. tmux redraws the status line every time a #()
# finishes, so four jobs finishing at four different times meant four repaints
# per interval, each a different width — and with status-justify 'centre' that
# drags the window list sideways on every one of them. status.sh runs the
# modules and emits the whole right side in a single write. See the script.
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#(~/.tmux/scripts/status.sh '#{pane_current_path}' \
'#{@thm_surface_0}' '#{@icon_green}' '#{@icon_peach}' '#{@icon_sapphire}' \
'#{@icon_mauve}' '#{@icon_yellow}' '#{@icon_red}' '#{@icon_teal}' \
'#{@pill_text}')"
set -ga status-right "#[fg=#{@fill_lavender},bg=default]#{@cap_l}\
#[bg=#{@fill_lavender},bold]#[fg=#{@icon_lavender}] #{@ico_clock}\
#[fg=#{@text_lavender}] %H:%M \
#[fg=#{@fill_lavender},bg=default,nobold]#{@cap_r}"

# window look and feel: inactive windows are quiet text, the active one is a
# filled pill, so focus is obvious at a glance.
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format "#[fg=#{@thm_overlay_1},bg=default] #I #{E:@win_icon} #W "
set -g window-status-current-format "#[fg=#{@acc_mauve},bg=default]#{@cap_l}\
#[fg=#{@pill_fg},bg=#{@acc_mauve},bold] #I #{E:@win_icon} #W \
#[fg=#{@acc_mauve},bg=default,nobold]#{@cap_r}"

set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-separator ""

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue}] #P #{pane_current_command} #[fg=#{@thm_blue},bg=default],#[fg=#{@thm_overlay_0}] #P #{pane_current_command} }"
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_1}"
setw -g pane-border-style "bg=default,fg=#{@thm_overlay_0}"

# Must stay last: tpm loads catppuccin (which reads @catppuccin_flavor set
# above) and continuum (which appends its autosave hook to status-right).
run '~/.tmux/plugins/tpm/tpm'

# After tpm, not before: this reads the @thm_* palette catppuccin publishes and
# derives the pill colors from it. The formats above reference the @acc_* /
# @fill_* / @text_* it sets, which tmux expands lazily on each redraw — so
# setting them after the formats are defined is fine.
run-shell '~/.tmux/scripts/palette.sh'
